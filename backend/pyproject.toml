[project]
name = "adp-backend"
version = "0.1.0"
description = "ADP FastAPI backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.1,<3.0",
    "supabase>=2.10,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "torch>=2.5,<3.0",
    "transformers>=4.48,<6.0",
    "safetensors>=0.5,<1.0",
]

[project.scripts]
adp-api = "app.main:run"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
